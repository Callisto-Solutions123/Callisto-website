<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Callisto | Creative Growth</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050509;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(110, 70, 255, .25), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(0, 180, 255, .16), transparent 30%);
      z-index: -1;
    }

    main {
      width: min(1100px, 90%);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 12px;
      opacity: .65;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(64px, 14vw, 160px);
      line-height: .85;
      letter-spacing: -6px;
    }

    h2 {
      font-size: clamp(26px, 5vw, 60px);
      font-weight: 400;
      margin-top: 25px;
      max-width: 800px;
    }

    p {
      margin-top: 30px;
      max-width: 600px;
      line-height: 1.7;
      color: #b9b9c4;
      font-size: 17px;
    }

    .orb {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.18);
      right: -120px;
      top: -100px;
      box-shadow:
        0 0 80px rgba(104, 70, 255, .25),
        inset 0 0 80px rgba(0, 180, 255, .12);
      z-index: -1;
    }
  </style>
</head>

<body>

  <div class="orb"></div>

  <main>
    <div class="eyebrow">Creative Growth Studio</div>

    <h1>CALLISTO</h1>

    <h2>
      Ideas with gravity.
      Growth with direction.
    </h2>

    <p>
      Brand. Digital. Content.
